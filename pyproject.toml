[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "news-digest-worker"
version = "0.1.1"
description = "Mistral Workflow worker: daily news digest email"
requires-python = ">=3.11"
dependencies = [
    "mistralai-workflows>=3.10",
    "mistralai>=3.0",
]

[tool.setuptools.packages.find]
where = ["src"]
